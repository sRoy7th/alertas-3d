// ============================================================
// Utilidades de animación
// ============================================================
// Reloj propio: en vivo avanza con requestAnimationFrame; en modo ?step se avanza a mano
// (window.__advance) para capturar fotogramas exactos.
let NOW = 0;
const timers = [];
const tickers = new Set();
const wait = (ms) => new Promise((r) => timers.push({ at: NOW + ms, r }));
function tween(ms, fn) {
  return new Promise((resolve) => {
    const start = NOW;
    const tk = (now) => {
      const t = Math.min(1, (now - start) / ms);
      fn(t);
      if (t >= 1) { tickers.delete(tk); resolve(); }
    };
    tickers.add(tk);
    fn(0);
  });
}
const ease = {
  outCubic: (t) => 1 - (1 - t) ** 3,
  inCubic: (t) => t ** 3,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: (t) => { const c = 1.70158; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
  outBounce: (t) => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  },
};
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

// ============================================================
// Texturas procedurales
// ============================================================
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TEX_GLOW = canvasTex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.2, 'rgba(255,255,255,.8)');
  r.addColorStop(0.5, 'rgba(255,255,255,.22)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});
const TEX_SMOKE = canvasTex(128, 128, (g, w) => {
  for (let i = 0; i < 26; i++) {
    const x = w / 2 + rand(-28, 28), y = w / 2 + rand(-28, 28), rr = rand(14, 34);
    const r = g.createRadialGradient(x, y, 0, x, y, rr);
    r.addColorStop(0, 'rgba(255,255,255,.35)');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, w);
  }
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  m.addColorStop(0.5, 'rgba(0,0,0,1)');
  m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, w, w);
});
const TEX_RAY = canvasTex(64, 256, (g, w, h) => {
  const v = g.createLinearGradient(0, h, 0, 0);
  v.addColorStop(0, 'rgba(255,255,255,0)');
  v.addColorStop(0.18, 'rgba(255,255,255,1)');
  v.addColorStop(0.5, 'rgba(255,255,255,.45)');
  v.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = v; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';
  const x = g.createLinearGradient(0, 0, w, 0);
  x.addColorStop(0, 'rgba(0,0,0,0)');
  x.addColorStop(0.35, 'rgba(0,0,0,.35)');
  x.addColorStop(0.5, 'rgba(0,0,0,1)');
  x.addColorStop(0.65, 'rgba(0,0,0,.35)');
  x.addColorStop(1, 'rgba(0,0,0,0)');

});
const TEX_RING = canvasTex(256, 256, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0.62, 'rgba(255,255,255,0)');
  r.addColorStop(0.86, 'rgba(255,255,255,1)');
  r.addColorStop(1, 'rgba(255,255,255,0)');

});
const TEX_HEART = canvasTex(128, 128, (g, w) => {
  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(w / 2, w * 0.82);
  g.bezierCurveTo(w * 0.08, w * 0.55, w * 0.12, w * 0.14, w / 2, w * 0.32);
  g.bezierCurveTo(w * 0.88, w * 0.14, w * 0.92, w * 0.55, w / 2, w * 0.82);

});
const TEX_COIN = canvasTex(256, 256, (g, w) => {

// ============================================================
// Partículas (pool de sprites)
// ============================================================
const _c = new THREE.Color();
function sampleColors(stops, k, out) {
  const f = k * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f));
  return out.copy(stops[i]).lerp(stops[i + 1], f - i);
}
class Pool {
  constructor(n, blending) {
    this.items = [];
    for (let i = 0; i < n; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: TEX_GLOW, blending, transparent: true, depthWrite: false, depthTest: false, toneMapped: false,
      }));
      s.visible = false;
      scene.add(s);
      this.items.push({ s, alive: false, vel: new THREE.Vector3() });
    }
  }
  spawn(o) {
    const p = this.items.find((i) => !i.alive);
    if (!p) return;
    p.alive = true; p.age = 0; p.life = o.life;
    p.vel.copy(o.vel); p.grav = o.grav ?? 0; p.drag = o.drag ?? 0;
    p.size0 = o.size; p.size1 = o.size1 ?? o.size;
    p.colors = o.colors; p.alpha = o.alpha ?? 1; p.spin = o.spin ?? 0;
    p.s.position.copy(o.pos);
    p.s.material.map = o.map || TEX_GLOW;
    p.s.material.rotation = Math.random() * Math.PI * 2;
    p.s.renderOrder = o.order ?? 10;
    p.s.visible = true;
  }
  update(dt) {
    for (const p of this.items) {
      if (!p.alive) continue;
      p.age += dt;
      const k = p.age / p.life;
      if (k >= 1) { p.alive = false; p.s.visible = false; continue; }
      p.vel.y -= p.grav * dt;
      p.vel.multiplyScalar(Math.max(0, 1 - p.drag * dt));
      p.s.position.addScaledVector(p.vel, dt);
      p.s.scale.setScalar(lerp(p.size0, p.size1, ease.outCubic(k)));
      p.s.material.rotation += p.spin * dt;
      p.s.material.color.copy(sampleColors(p.colors, k, _c));
      p.s.material.opacity = p.alpha * (k < 0.08 ? k / 0.08 : 1 - (k - 0.08) / 0.92);
    }
  }
}
const FX = new Pool(600, THREE.AdditiveBlending);

}

function flash(pos, size = 5, ms = 450, color = 0xffffff) {

    flashSprite.scale.setScalar(size * (0.4 + 0.6 * ease.outCubic(t)));
    flashSprite.material.opacity = 1 - t;
  });
}

  scene.add(m);

}

// ============================================================
// Audio sintetizado (no requiere archivos)
// ============================================================
let ac, master;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  master.gain.value = CFG.volume;
  return ac;
}
function tone(freq, when, dur, { type = 'sine', gain = 0.2, to = null, attack = 0.005 } = {}) {
  const a = audio(), t0 = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf;
function noise(when, dur, { type = 'bandpass', from = 800, to = 800, q = 1, gain = 0.3, attack = 0.01 } = {}) {
  const a = audio(), t0 = a.currentTime + when;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; src.loop = true;
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(from, t0);
  f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t0); src.stop(t0 + dur + 0.05);
  return g;
}
const sfx = {

// ============================================================
// Pantalla rota: grietas procedurales en un canvas 2D entre el texto y el 3D
// ============================================================
const crackCanvas = document.getElementById('crack');
const cctx = crackCanvas.getContext('2d');
const cracks = [];
const toPx = (v) => ({ x: 960 + v.x * 201.5, y: 540 - v.y * 201.5 });

function makeCrack(x, y, size) {
  const radial = [];
  const N = 9 + ((Math.random() * 5) | 0);
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * Math.PI * 2 + rand(-0.25, 0.25);
    const len = size * rand(0.45, 1);
    const pts = [[x, y]];
    let px = x, py = y, a = a0, d = 0;
    const seg = len / rand(6, 9);
    while (d < len) {
      a += rand(-0.3, 0.3) * 0.6;
      const st = seg * rand(0.6, 1.3);
      px += Math.cos(a) * st;
      py += Math.sin(a) * st;
      d += st;
      pts.push([px, py]);
    }
    radial.push({ pts, w: rand(0.6, 1.8), a: a0, o: rand(0.55, 1) });
  }
  // ramificaciones
  const branches = [];
  for (const r of radial) {
    if (Math.random() < 0.7) {
      const k = 2 + ((Math.random() * (r.pts.length - 3)) | 0);
      const [bx, by] = r.pts[k];
      let a = r.a + (Math.random() < 0.5 ? -1 : 1) * rand(0.4, 0.9), px = bx, py = by;
      const pts = [[bx, by]];
      for (let j = 0; j < 4; j++) {
        a += rand(-0.3, 0.3);
        px += Math.cos(a) * size * 0.06;
        py += Math.sin(a) * size * 0.06;
        pts.push([px, py]);
      }
      branches.push({ pts, w: rand(0.5, 1.1), o: rand(0.4, 0.9) });
    }
  }
  // anillos concéntricos que unen grietas vecinas
  const rings = [];
  const at = (r, dist) => {
    let acc = 0;
    for (let j = 1; j < r.pts.length; j++) {
      const [x0, y0] = r.pts[j - 1], [x1, y1] = r.pts[j];
      const l = Math.hypot(x1 - x0, y1 - y0);
      if (acc + l >= dist) { const t = (dist - acc) / l; return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]; }
      acc += l;
    }
    return null;
  };
  for (const [ri, skip] of [[0.1, 0.05], [0.24, 0.35], [0.45, 0.65]]) {
    for (let i = 0; i < N; i++) {
      if (Math.random() < skip) continue;
      const p0 = at(radial[i], size * ri * rand(0.85, 1.15));
      const p1 = at(radial[(i + 1) % N], size * ri * rand(0.85, 1.15));
      if (!p0 || !p1) continue;
      const mx = (p0[0] + p1[0]) / 2 + rand(-6, 6), my = (p0[1] + p1[1]) / 2 + rand(-6, 6);
      rings.push({ pts: [p0, [mx, my], p1], w: rand(0.5, 1.2), o: rand(0.35, 0.85) });
    }
  }
  // facetas: triángulos translúcidos entre grietas vecinas (cada fragmento refleja distinto)
  const facets = [];
  for (let i = 0; i < N; i++) {
    const p0 = at(radial[i], size * rand(0.18, 0.32)), p1 = at(radial[(i + 1) % N], size * rand(0.18, 0.32));
    if (p0 && p1 && Math.random() < 0.6) facets.push({ pts: [[x, y], p0, p1], o: rand(0.03, 0.11) });
  }
  return { x, y, size, radial, branches, rings, facets, p: 0, alpha: 1 };
}

function strokePath(pts, upto, w, o = 1) {
  const n = Math.max(2, Math.ceil(pts.length * upto));
  cctx.beginPath();
  cctx.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j < n && j < pts.length; j++) cctx.lineTo(pts[j][0], pts[j][1]);
  // sombra, filo brillante y halo: se lee como vidrio sobre cualquier fondo
  cctx.strokeStyle = `rgba(0,0,0,${0.4 * o})`; cctx.lineWidth = w + 1.4; cctx.stroke();
  cctx.strokeStyle = `rgba(210,235,255,${0.14 * o})`; cctx.lineWidth = w + 4; cctx.stroke();
  cctx.strokeStyle = `rgba(255,255,255,${0.92 * o})`; cctx.lineWidth = w; cctx.stroke();
}

function drawCracks() {
  cctx.clearRect(0, 0, 1920, 1080);
  cctx.lineCap = 'round';
  cctx.lineJoin = 'round';
  for (const c of cracks) {
    cctx.globalAlpha = c.alpha;
    // zona astillada del centro
    const g = cctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.size * 0.12);
    g.addColorStop(0, 'rgba(255,255,255,.55)');
    g.addColorStop(1, 'rgba(220,240,255,0)');
    cctx.fillStyle = g;
    cctx.beginPath();
    cctx.arc(c.x, c.y, c.size * 0.12 * Math.min(1, c.p * 3), 0, Math.PI * 2);
    cctx.fill();
    const q = Math.max(0, (c.p - 0.45) / 0.55);
    for (const f of c.facets) {
      cctx.fillStyle = `rgba(225,240,255,${f.o * q})`;
      cctx.beginPath();
      f.pts.forEach(([fx, fy], j) => (j ? cctx.lineTo(fx, fy) : cctx.moveTo(fx, fy)));
      cctx.fill();
    }
    for (const r of c.radial) strokePath(r.pts, c.p, r.w, r.o);
    if (q > 0) {
      for (const b of c.branches) strokePath(b.pts, q, b.w, b.o);
      for (const r of c.rings) strokePath(r.pts, q, r.w, r.o);
    }
  }
  cctx.globalAlpha = 1;
}

async function crackAt(world, size = 330) {
  const { x, y } = toPx(world);
  const c = makeCrack(x, y, size);
  cracks.push(c);
  sfx.glass();
  await tween(170, (t) => { c.p = ease.outCubic(t); drawCracks(); });
}

// Al explotar: el vidrio se desprende en pedacitos y las grietas se desvanecen
function shatterCracks() {
  for (const c of cracks) {
    const w = new THREE.Vector3((c.x - 960) / 201.5, (540 - c.y) / 201.5, 0.3);
    for (let i = 0; i < 26; i++) {
      FX.spawn({
        pos: w.clone().add(new THREE.Vector3(rand(-0.6, 0.6), rand(-0.6, 0.6), 0)),
        vel: new THREE.Vector3(rand(-1.5, 1.5), rand(-0.5, 1.5), rand(0, 1.5)), grav: 7,
        life: rand(0.6, 1.1), size: rand(0.04, 0.1), size1: 0.03, colors: [C('#ffffff'), C('#cfe8ff'), C('#6f8fb0')],
      });
    }
  }
  const a0 = cracks.map((c) => c.alpha);
  return tween(450, (t) => {
    cracks.forEach((c, i) => { c.alpha = a0[i] * (1 - t); });
    drawCracks();
  }).then(() => { cracks.length = 0; drawCracks(); });
}

const loader = new GLTFLoader();
// rig (posición/escala animada) > idle (flotación) > modelo centrado
function makeRig(obj, fitSize, axis = 'y') {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = fitSize / (axis === 'max' ? Math.max(size.x, size.y, size.z) : size[axis]);
  const wrap = new THREE.Group();
  obj.position.copy(center).multiplyScalar(-s);
  obj.scale.setScalar(s);
  wrap.add(obj);
  const idle = new THREE.Group();
  idle.add(wrap);
  const rig = new THREE.Group();
  rig.add(idle);
  rig.visible = false;
  rig.userData = { idle, wrap, model: obj, size: size.multiplyScalar(s) };
  scene.add(rig);
  return rig;
}
const M = {};
async function loadModels() {
  const [puzzle, kunai, wallet, cinna] = await Promise.all(
    ['puzzle_parts.glb', 'kunai.glb', 'wallet.glb', 'cinnamoroll.glb'].map((f) => loader.loadAsync(CFG.models + f)),
  );
  M.puzzle = makeRig(puzzle.scene, 2.3);
  // Piezas sueltas del rompecabezas (pieza_00 es el cuerpo). Se ensamblan de abajo hacia arriba:
  // primero el Ojo, luego esquineros, barra y al final el aro.
  const parts = [];
  puzzle.scene.traverse((o) => { if (o.isMesh && o.name !== 'pieza_00') parts.push(o); });
  M.puzzle.userData.parts = parts
    .sort((a, b) => a.position.y - b.position.y)
    .map((obj) => ({ obj, home: obj.position.clone(), qHome: obj.quaternion.clone(), start: new THREE.Vector3(), q0: new THREE.Quaternion() }));
  // La boca de la rana mira hacia +X en el modelo: la giramos hacia la cámara
  wallet.scene.rotation.y = -Math.PI / 2;
  wallet.scene.updateMatrixWorld(true);
  M.wallet = makeRig(wallet.scene, 3.2, 'x');
  M.wallet.userData.rig = rigWallet(wallet.scene);
  M.kunaiSrc = kunai.scene;
  M.cinna = makeCinnamoroll(cinna.scene);
}

// El monedero no tiene esqueleto: se arma un rig manual sobre la malla (coordenadas originales del .glb).
// La boca abre hacia +Z; las bisagras del broche están en y≈23, z≈0. La mitad de arriba (labio, ojos,
// broche superior) gira sobre ese eje con una transición suave hacia la espalda para que la tela se doble.
// Las piezas sueltas que quedan frente a la rana (dos monedas y el papel) se pueden hacer temblar.
const JAW = { y: 23, z: 0, split: 0.17, closed: 0.95 };
function rigWallet(root) {
  let mesh = null;
  root.traverse((o) => { if (o.isMesh) mesh = o; });
  const g = mesh.geometry, P = g.attributes.position, N = g.attributes.normal, I = g.index.array;
  const n = P.count, p0 = Float32Array.from(P.array), n0 = Float32Array.from(N.array);

  // Partes sueltas: une vértices en la misma posición (costuras UV) y luego por triángulos
  const parent = new Int32Array(n).map((_, i) => i);
  const find = (x) => { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; };
  const seen = new Map();
  for (let i = 0; i < n; i++) {
    const k = `${p0[i * 3].toFixed(2)},${p0[i * 3 + 1].toFixed(2)},${p0[i * 3 + 2].toFixed(2)}`;
    if (seen.has(k)) parent[find(i)] = find(seen.get(k)); else seen.set(k, i);
  }
  for (let t = 0; t < I.length; t += 3) {
    const a = find(I[t]);
    parent[find(I[t + 1])] = a;
    parent[find(I[t + 2])] = a;
  }
  const comps = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!comps.has(r)) comps.set(r, { verts: [], c: [0, 0, 0] });
    const c = comps.get(r);
    c.verts.push(i);
    for (let k = 0; k < 3; k++) c.c[k] += p0[i * 3 + k];
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const side = (y, z) => (y - JAW.y) * Math.cos(JAW.split) - (z - JAW.z) * Math.sin(JAW.split);
  const w = new Float32Array(n);
  const loose = [];
  for (const c of comps.values()) {
    c.c = c.c.map((v) => v / c.verts.length);
    if (c.c[2] > 45) { loose.push({ verts: c.verts, c: c.c, ph: Math.random() * 10 }); continue; }
    const big = c.verts.length > 500;
    for (const i of c.verts) {
      const y = big ? p0[i * 3 + 1] : c.c[1], z = big ? p0[i * 3 + 2] : c.c[2];
      w[i] = smooth(-3, 3, side(y, z)) * smooth(-40, 0, z);
    }
  }

  const rot = (arr, src, i, cy, cz, th) => {
    const y = src[i * 3 + 1] - cy, z = src[i * 3 + 2] - cz, c = Math.cos(th), s = Math.sin(th);
    arr[i * 3 + 1] = cy + y * c - z * s;
    arr[i * 3 + 2] = cz + y * s + z * c;
  };
  return {
    // jaw: 0 abierta → 1 cerrada; shake: intensidad del temblor de las monedas sueltas
    update(jaw, shake, t) {
      const A = P.array, B = N.array;
      A.set(p0);
      B.set(n0);
      const th = jaw * JAW.closed;
      if (th) {
        for (let i = 0; i < n; i++) {
          if (!w[i]) continue;
          rot(A, p0, i, JAW.y, JAW.z, th * w[i]);
          rot(B, n0, i, 0, 0, th * w[i]);
        }
      }
      for (const L of loose) {
        const rx = Math.sin(t * 23 + L.ph) * shake, rz = Math.sin(t * 19 + L.ph * 2) * shake;
        const lift = Math.abs(Math.sin(t * 31 + L.ph)) * shake * 14;
        const [cx, cy, cz] = L.c;
        const cX = Math.cos(rx), sX = Math.sin(rx), cZ = Math.cos(rz), sZ = Math.sin(rz);
        for (const i of L.verts) {
          for (const [dst, src, o, up] of [[A, p0, L.c, lift], [B, n0, [0, 0, 0], 0]]) {
            let x = src[i * 3] - o[0], y = src[i * 3 + 1] - o[1], z = src[i * 3 + 2] - o[2];
            [y, z] = [y * cX - z * sX, y * sX + z * cX];
            [x, y] = [x * cZ - y * sZ, x * sZ + y * cZ];
            dst[i * 3] = o[0] + x;
            dst[i * 3 + 1] = o[1] + y + up;
            dst[i * 3 + 2] = o[2] + z;
          }
        }
      }
      P.needsUpdate = true;
      N.needsUpdate = true;
    },
    info: { parts: comps.size, loose: loose.length, upper: w.filter((v) => v > 0.5).length },
  };
}

// Separa una malla en sus piezas sueltas (une costuras UV por posición). Cada pieza queda como Mesh
// propio con su pivote en `pivotOf(verts)` (por defecto el centro), dentro de un Group que reemplaza a la malla.
function splitParts(mesh, pivotOf) {
  const g = mesh.geometry, P = g.attributes.position, I = g.index.array, n = P.count;
  const parent = new Int32Array(n).map((_, i) => i);
  const find = (x) => { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; };
  const seen = new Map();
  for (let i = 0; i < n; i++) {
    const k = `${P.getX(i).toFixed(4)},${P.getY(i).toFixed(4)},${P.getZ(i).toFixed(4)}`;
    if (seen.has(k)) parent[find(i)] = find(seen.get(k)); else seen.set(k, i);
  }
  for (let t = 0; t < I.length; t += 3) { const a = find(I[t]); parent[find(I[t + 1])] = a; parent[find(I[t + 2])] = a; }
  const groups = new Map();
  for (let t = 0; t < I.length; t += 3) {
    const r = find(I[t]);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(I[t], I[t + 1], I[t + 2]);
  }
  const holder = new THREE.Group();
  holder.position.copy(mesh.position); holder.quaternion.copy(mesh.quaternion); holder.scale.copy(mesh.scale);
  holder.name = mesh.name;
  const parts = [];
  for (const idx of groups.values()) {
    const map = new Map(), verts = [];
    for (const i of idx) if (!map.has(i)) { map.set(i, verts.length); verts.push(i); }
    const geo = new THREE.BufferGeometry();
    for (const [name, attr] of Object.entries(g.attributes)) {
      // se lee por accesor: los atributos pueden venir intercalados en un mismo buffer
      const get = ['getX', 'getY', 'getZ', 'getW'];
      const arr = new Float32Array(verts.length * attr.itemSize);
      verts.forEach((v, j) => { for (let c = 0; c < attr.itemSize; c++) arr[j * attr.itemSize + c] = attr[get[c]](v); });
      geo.setAttribute(name, new THREE.BufferAttribute(arr, attr.itemSize, false));
    }
    geo.setIndex(idx.map((i) => map.get(i)));
    geo.computeBoundingBox();
    const pv = pivotOf ? pivotOf(geo) : geo.boundingBox.getCenter(new THREE.Vector3());
    geo.translate(-pv.x, -pv.y, -pv.z);
    const m = new THREE.Mesh(geo, mesh.material);
    m.position.copy(pv);
    m.userData.home = pv.clone();
    m.userData.tris = idx.length / 3;
    holder.add(m);
    parts.push(m);
  }
  mesh.parent.add(holder);
  mesh.parent.remove(mesh);
  return { holder, parts: parts.sort((a, b) => b.userData.tris - a.userData.tris) };
}

// Cinnamoroll: sin esqueleto, pero con piezas sueltas. Se separan y se les pone pivote donde se unen al cuerpo
// (raíz de las orejas, hombros, cadera) y un grupo "cuello" para que cabeza, orejas y ositito se muevan juntos.
function makeCinnamoroll(root) {
  const byNode = {};
  root.traverse((o) => { if (o.isMesh) byNode[o.parent.name] = o; });
  const nearest = (to) => (geo) => {
    const P = geo.attributes.position, v = new THREE.Vector3(), best = new THREE.Vector3();
    let d = Infinity;
    for (let i = 0; i < P.count; i++) {
      v.fromBufferAttribute(P, i);
      const dd = v.distanceToSquared(to);
      if (dd < d) { d = dd; best.copy(v); }
    }
    return best;
  };
  // Orejas: pivote en la raíz (arriba, pegado a la cabeza); brazos y patas: el punto más cercano al centro del cuerpo
  const headSplit = splitParts(byNode.polySurface19, (geo) => {
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    return Math.abs(c.x) < 0.2 ? c : nearest(new THREE.Vector3(Math.sign(c.x) * 0.28, 1.0, 0))(geo);
  });
  const bodySplit = splitParts(byNode.polySurface5, (geo) => {
    const c = geo.boundingBox.getCenter(new THREE.Vector3());
    return Math.abs(c.x) < 0.15 ? c : nearest(new THREE.Vector3(0, 0.3, 0))(geo);
  });
  const bear = byNode.pCube11;

  const [head, ...ears] = headSplit.parts;
  const earR = ears.find((m) => m.position.x > 0), earL = ears.find((m) => m.position.x < 0);
  const bp = bodySplit.parts;
  const tail = bp.reduce((a, b) => (b.position.z < a.position.z ? b : a));
  const limbs = bp.filter((m) => m !== tail && Math.abs(m.position.x) > 0.15);
  const arms = limbs.filter((m) => m.position.y > 0.3), feet = limbs.filter((m) => m.position.y <= 0.3);
  const armR = arms.find((m) => m.position.x > 0), armL = arms.find((m) => m.position.x < 0);

  // Cuello: pivote bajo la cabeza; cabeza, orejas y ositito cuelgan de él
  const neck = new THREE.Group();
  neck.position.set(0, 0.5, 0);
  headSplit.holder.parent.add(neck);
  root.updateMatrixWorld(true);
  neck.updateMatrixWorld(true);
  for (const o of [head, earR, earL, bear]) neck.attach(o);

  const rigd = makeRig(root, 2.5);
  rigd.userData.cinna = { neck, head, earR, earL, armR, armL, feet, tail, bear, bearY: bear.position.y };
  return rigd;
}

// Cada kunai es un clon con su propio material para el papel (se quema solo).
// Se lanza desde el frente y un costado: la hoja apunta hacia dentro de la escena (abajo a la izquierda y al fondo)
const KUNAI_DIR = new THREE.Vector3(-0.3, -0.55, -0.78).normalize();
function makeKunai() {
  const obj = M.kunaiSrc.clone(true);
  const part = (name) => {
    let m = null;
    obj.traverse((o) => { if (o.isMesh && (o.parent?.name?.startsWith(name) || o.name.startsWith(name))) m = o; });
    return m;
  };
  const paper = part('Plane001'), blade = part('pCube1'), ring = part('pTorus1'), line = part('Line001');
  if (paper) {
    paper.material = paper.material.clone();
    paper.material.emissive = new THREE.Color(0xff5a14);
    paper.material.emissiveIntensity = 0;
  }
  const center = (o) => new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
  let pivot = null, attach = null;
  if (paper && blade && ring) {
    // 1) El eje aro→hoja apunta en KUNAI_DIR
    obj.updateMatrixWorld(true);
    const q = new THREE.Quaternion().setFromUnitVectors(center(blade).sub(center(ring)).normalize(), KUNAI_DIR);
    obj.quaternion.premultiply(q);
    obj.updateMatrixWorld(true);

    // 2) El cordón y el papel cuelgan de un pivote en el aro (el punto del cordón más cercano al aro)
    const cr = center(ring);
    attach = cr.clone();
    if (line) {
      const lp = line.geometry.attributes.position, v = new THREE.Vector3();
      let best = Infinity;
      for (let i = 0; i < lp.count; i++) {
        v.fromBufferAttribute(lp, i).applyMatrix4(line.matrixWorld);
        const d = v.distanceTo(cr);
        if (d < best) { best = d; attach.copy(v); }
      }
    }
    pivot = new THREE.Group();
    pivot.position.copy(obj.worldToLocal(attach.clone()));
    obj.add(pivot);
    pivot.updateMatrixWorld(true);
    if (line) pivot.attach(line);
    pivot.attach(paper);
    const SHORT = 0.45;
    for (const o of [line, paper]) if (o) { o.position.multiplyScalar(SHORT); if (o === line) o.scale.multiplyScalar(SHORT); }
    paper.scale.multiplyScalar(0.8);
    pivot.updateMatrixWorld(true);

    // 3) Gravedad: el papel cuelga hacia abajo y con la cara hacia la cámara
    const down = new THREE.Vector3(0, -1, 0);
    const hang = new THREE.Quaternion().setFromUnitVectors(center(paper).sub(attach).normalize(), down);
    const nAttr = paper.geometry.attributes.normal, nrm = new THREE.Vector3();
    for (let i = 0; i < nAttr.count; i += 7) nrm.add(new THREE.Vector3().fromBufferAttribute(nAttr, i));
    nrm.transformDirection(paper.matrixWorld).applyQuaternion(hang).projectOnPlane(down).normalize();
    const face = new THREE.Vector3(0, 0, 1);
    const roll = nrm.dot(face) < -0.99
      ? new THREE.Quaternion().setFromAxisAngle(down, Math.PI)
      : new THREE.Quaternion().setFromUnitVectors(nrm, face);
    const objQ = obj.quaternion.clone(), objQi = objQ.clone().invert();
    const toLocal = (world) => objQi.clone().multiply(world).multiply(objQ);
    pivot.quaternion.copy(toLocal(roll.multiply(hang)));
    pivot.userData.rest = pivot.quaternion.clone();
    // Balanceo: giros en ejes del mundo (x = hacia/desde la cámara, z = de lado a lado)
    const e = new THREE.Euler();
    pivot.userData.swing = (ax, az) => {
      pivot.quaternion.copy(toLocal(new THREE.Quaternion().setFromEuler(e.set(ax, 0, az)))).multiply(pivot.userData.rest);
    };
  }
  const rig = makeRig(obj, 3.1, 'max');
  rig.userData.paper = paper;
  rig.userData.pivot = pivot;
  rig.updateMatrixWorld(true);
  // Punta de la hoja relativa al centro del rig (para clavarla exactamente en una letra)
  if (blade) {
    const v = new THREE.Vector3(), tip = new THREE.Vector3();
    let best = -Infinity;
    const bp = blade.geometry.attributes.position;
    for (let i = 0; i < bp.count; i++) {
      v.fromBufferAttribute(bp, i).applyMatrix4(blade.matrixWorld);
      const d = v.dot(KUNAI_DIR);
      if (d > best) { best = d; tip.copy(v); }
    }
    rig.userData.tip = tip;
  }
  if (paper && pivot) setupPaperBurn(paper, pivot.getWorldPosition(new THREE.Vector3()));
  return rig;
}

// El papel se consume desde la punta lejana hacia el kunai: u = 0 junto al aro, u = 1 en el extremo.
// Un shader descarta lo ya quemado, pinta una franja carbonizada y un borde incandescente.
function setupPaperBurn(paper, near) {
  const cb = near.clone();
  const cp = new THREE.Box3().setFromObject(paper).getCenter(new THREE.Vector3());
  const a = paper.worldToLocal(cp.clone()).sub(paper.worldToLocal(cb.clone())).normalize();
  const pos = paper.geometry.attributes.position;
  const proj = [];
  for (let i = 0; i < pos.count; i++) proj.push(new THREE.Vector3().fromBufferAttribute(pos, i).dot(a));
  const min = Math.min(...proj), len = Math.max(...proj) - min;
  const burn = { uBurn: { value: 1.02 }, uAxis: { value: a }, uMin: { value: min }, uLen: { value: len } };
  const m = paper.material;
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, burn);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uAxis; uniform float uMin; uniform float uLen; varying float vBurnU;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvBurnU = (dot(position, uAxis) - uMin) / uLen;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uBurn; varying float vBurnU;')
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vBurnU > uBurn) discard;')
      .replace('#include <emissivemap_fragment>', [
        '#include <emissivemap_fragment>',
        'float dB = uBurn - vBurnU;',
        'float edge = 1.0 - smoothstep(0.0, 0.09, dB);',
        'float charred = 1.0 - smoothstep(0.04, 0.2, dB);',
        'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.05, 0.025, 0.015), charred * 0.92);',
        'totalEmissiveRadiance += vec3(1.0, 0.45, 0.08) * edge * 8.0;',
      ].join('\n'));
  };
  m.customProgramCacheKey = () => 'paper-burn';
  paper.userData.burn = burn;
  paper.userData.u = proj.map((q) => (q - min) / len);
}

// ============================================================
// Emisores continuos mientras la alerta está en pantalla
// ============================================================
const emitters = new Set();

// ============================================================
// Alerta: Rompecabezas del Milenio (follow, bits, raid)
// ============================================================
async function puzzleAlert({ level = 1, color = '#ffd36b', kicker, name, amount = '', msg = '', hold = CFG.holdMs, raid = false }) {
  const P = M.puzzle, idle = P.userData.idle;
  const col = new THREE.Color(color);
  rayMat.color.copy(col);
  halo.material.color.copy(col);
  const colors = [C('#ffffff'), col.clone().lerp(C('#ffffff'), 0.4), col, col.clone().multiplyScalar(0.3)];

  P.visible = true;
  P.position.copy(ANCHOR);
  idle.position.set(0, 0, 0);
  idle.rotation.set(0, 0, 0);
  // Las piezas arrancan dispersas y giradas; más lejos y más lento en un raid
  const parts = P.userData.parts;
  const spread = raid ? 1.6 : 1;
  for (const p of parts) {
    const dir = new THREE.Vector3(p.home.x, p.home.y, 0);
    if (dir.length() < 60) dir.set(rand(-1, 1), rand(-1, 1), 0);
    dir.normalize();
    p.start.copy(p.home).addScaledVector(dir, rand(320, 520) * spread).add(new THREE.Vector3(0, 0, rand(150, 350)));
    p.q0.setFromEuler(new THREE.Euler(rand(-Math.PI, Math.PI), rand(-Math.PI, Math.PI), rand(-Math.PI, Math.PI)));
    p.obj.position.copy(p.start);
    p.obj.quaternion.copy(p.q0);
  }
  sfx.whoosh(true);
  const spinIn = tween(950, (t) => {
    const e = ease.outCubic(t);
    P.scale.setScalar(ease.outBack(t));
    P.rotation.y = (1 - e) * -Math.PI * 4;
    P.position.y = ANCHOR.y - 1.4 * (1 - e);
  });
  await wait(300);
  const step = raid ? 110 : 70, fly = raid ? 650 : 480;
  const wp = new THREE.Vector3();
  await Promise.all(parts.map((p, i) => wait(i * step).then(() => tween(fly, (t) => {
    const e = ease.outBack(t);
    p.obj.position.lerpVectors(p.start, p.home, e);
    p.obj.quaternion.slerpQuaternions(p.q0, p.qHome, Math.min(1, ease.outCubic(t)));
  })).then(() => {
    sfx.click();
    p.obj.getWorldPosition(wp);
    sparkBurst(wp.clone().setZ(wp.z + 0.2), 6, { speed: 1.6, colors, size: 0.06, life: 0.4 });
  })));
  await spinIn;

  const eye = ANCHOR.clone().setZ(0.6);
  flash(eye, 3 + level, 500, color);
  sparkBurst(eye, 30 + level * 30, { speed: 3 + level, colors });
  sfx.shimmer(level);
  if (raid) {
    sfx.boom(1.3);
    shake(0.35);
    shockwave(ANCHOR, 12, 1100, color);
    wait(250).then(() => shockwave(ANCHOR, 9, 1000, color));
  }
  showCard({ kicker, name, amount, msg, accent: color });

  // Largo máximo ~1.9 u: el rayo se desvanece antes del borde superior del lienzo (1.93 u sobre ANCHOR)
  const rayTarget = 1.2 + level * 0.18;
  tween(700, (t) => {
    rays.scale.setScalar(0.001 + rayTarget * ease.outBack(t));
    halo.material.opacity = 0.35 + 0.12 * level * t;
  });

  const bob = (now, dt) => {
    const s = now / 1000;
    idle.position.y = Math.sin(s * 2) * 0.07;
    idle.rotation.y = Math.sin(s * 1.1) * 0.4;
    rays.rotation.z -= dt * (0.25 + level * 0.08);
    const rate = 12 * level * dt;
    for (let i = 0; i < rate || Math.random() < rate; i++) {
      const a = rand(0, Math.PI * 2), r = rand(0.6, 1.5);
      FX.spawn({
        pos: new THREE.Vector3(ANCHOR.x + Math.cos(a) * r, ANCHOR.y + Math.sin(a) * r, rand(-0.5, 0.8)),
        vel: new THREE.Vector3(0, rand(0.3, 0.9), 0), life: rand(1, 1.8), size: rand(0.05, 0.14), colors,
      });
    }
  };
  emitters.add(bob);
  let pulsing = raid;
  (async () => {
    while (pulsing) {
      await wait(1400);
      if (pulsing) { shockwave(ANCHOR, 8, 900, color); sfx.shimmer(1); }
    }
  })();

  await wait(hold);
  pulsing = false;
  emitters.delete(bob);
  hideCard();
  sfx.whoosh(false);
  const r0 = P.rotation.y;
  // Se desarma: las piezas salen disparadas hacia afuera mientras el cuerpo se encoge
  for (const p of parts) {
    p.start.copy(p.home);
    p.q0.setFromEuler(new THREE.Euler(rand(-3, 3), rand(-3, 3), rand(-3, 3)));
  }
  await tween(650, (t) => {
    const e = ease.inCubic(t);
    for (const p of parts) {
      const d = new THREE.Vector3(p.home.x, p.home.y, 120).normalize();
      p.obj.position.copy(p.home).addScaledVector(d, ease.outCubic(t) * 450);
      p.obj.quaternion.slerpQuaternions(p.qHome, p.q0, t);
    }
    P.scale.setScalar(1 - e);
    P.rotation.y = r0 + e * Math.PI * 3;
    P.position.y = ANCHOR.y + e * 0.6;
    rays.scale.setScalar(0.001 + rayTarget * (1 - e));
    halo.material.opacity *= 0.9;
  });
  sparkBurst(ANCHOR, 25, { speed: 2.5, colors, size: 0.08 });
  halo.material.opacity = 0;
  P.visible = false;
}

// ============================================================
// Alerta: Kunai explosivo (subs y regalos)
// ============================================================
// Posición (mundo, plano z=0) de la parte alta de una letra del nombre, a partir del layout del DOM
const PX = 201.5; // píxeles por unidad en z=0
function letterPoint(span) {
  const x = card.offsetLeft + span.offsetLeft + span.offsetWidth / 2;
  const y = card.offsetTop + el.name.offsetTop + span.offsetTop + span.offsetHeight * 0.28;
  return new THREE.Vector3((x - 960) / PX, (540 - y) / PX, 0);
}
function joltLetters(pt, radius = 1.2) {
  for (const sp of el.name.children) {
    const d = letterPoint(sp).distanceTo(pt);
    if (d > radius) continue;
    const k = 1 - d / radius;
    sp.animate([
      { transform: 'translate(0,0) rotate(0)' },
      { transform: `translate(${rand(-4, 4) * k}px, ${10 * k}px) rotate(${rand(-8, 8) * k}deg)` },
      { transform: 'translate(0,0) rotate(0)' },
    ], { duration: 320, easing: 'ease-out' });
  }
}
// La onda expansiva avienta las letras lejos de la explosión más cercana
function blowCard(points) {
  for (const sp of el.name.children) {
    const lp = letterPoint(sp);
    let near = points[0];
    for (const p of points) if (p.distanceTo(lp) < near.distanceTo(lp)) near = p;
    const dir = lp.clone().sub(near);
    const f = 1 / Math.max(0.35, dir.length());
    dir.normalize();
    const dx = dir.x * PX * rand(1.2, 2.2) * f, dy = -dir.y * PX * rand(1.2, 2.2) * f - rand(20, 80);
    sp.animate([
      { transform: 'none', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${rand(-160, 160)}deg) scale(${rand(0.6, 1.1)})`, opacity: 0 },
    ], { duration: rand(700, 1000), easing: 'cubic-bezier(.15,.75,.3,1)', fill: 'forwards' });
  }
  for (const k of [el.kicker, el.amount, el.msg]) {
    k.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.9)' }], { duration: 300, fill: 'forwards' });
  }
}

// Líneas de zoom estilo anime: rayas radiales que se cierran hacia el punto de impacto
function zoomLines(center) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({
    map: TEX_RAY, color: 0xeaf6ff, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, toneMapped: false, opacity: 0,
  });
  for (let i = 0; i < 26; i++) {
    const m = new THREE.Mesh(rayGeo, mat);
    const ang = (i / 26) * Math.PI * 2 + rand(-0.1, 0.1);
    m.rotation.z = ang - Math.PI / 2;                 // +Y del rayo apunta hacia afuera
    m.scale.set(rand(0.3, 0.8), rand(2, 4), 1);
    m.userData.r = rand(2.2, 3.4);
    m.userData.dir = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0);
    g.add(m);
  }
  g.position.copy(center).setZ(0.5);
  g.renderOrder = 3;
  scene.add(g);
  const set = (t) => {
    for (const m of g.children) m.position.copy(m.userData.dir).multiplyScalar(m.userData.r * (1.4 - 0.9 * t));
    mat.opacity = Math.sin(Math.min(1, t) * Math.PI) * 0.75;
  };
  return { g, mat, set };
}

async function kunaiAlert({ count = 1, big = 1, kicker, name, msg = '', hold = CFG.holdMs, accent = '#ff7a1a' }) {
  const n = Math.min(count, 5);
  // El nombre aparece primero: los kunais se clavan en sus letras
  showCard({ kicker, name, msg, accent, theme: 'kunai' });
  await wait(520);
  const spans = [...el.name.children];
  const pick = (i) => spans[Math.min(spans.length - 1, Math.round(((i + 0.5) / n) * spans.length - 0.5))];
  const kScale = n > 1 ? 0.72 : 1;
  // En regalos se reparten a lo ancho del nombre, con separación mínima para no amontonarse
  const first = letterPoint(spans[0]), last = letterPoint(spans[spans.length - 1]);
  const cx = (first.x + last.x) / 2, w = Math.max(last.x - first.x + 1, (n - 1) * 1.15);
  const ks = Array.from({ length: n }, (_, i) => {
    const k = makeKunai();
    // una sola sub: se clava en la última letra para que el papel cuelgue a un lado del nombre
    const tipPt = n === 1 ? letterPoint(spans[spans.length - 1]) : letterPoint(pick(i)).setX(cx + (i / (n - 1) - 0.5) * w)
      // regalos: en arco por encima del nombre para que los papeles no tapen el texto
      .setY(first.y + 1.45 - Math.pow((i / (n - 1) - 0.5) * 2, 2) * 0.25);
    k.userData.tipPt = tipPt;
    k.userData.target = tipPt.clone().sub(k.userData.tip.clone().multiplyScalar(kScale));
    return k;
  });
  const main = ks[Math.floor((n - 1) / 2)];
  // Péndulo del papel: x = hacia/desde la cámara, z = de lado a lado
  for (const k of ks) k.userData.sw = { x: 0, vx: 0, z: 0, vz: 0, heat: 0, len: 1 };
  const swingPhys = (now, dt) => {
    for (const k of ks) {
      const sw = k.userData.sw, piv = k.userData.pivot;
      if (!piv || !k.visible) continue;
      // más corto (se va quemando) = oscila más rápido; el calor lo empuja al azar
      const w2 = 55 / Math.max(0.3, sw.len);
      sw.vz += (-w2 * Math.sin(sw.z) - 1.1 * sw.vz + rand(-1, 1) * 40 * sw.heat) * dt;
      sw.vx += (-w2 * Math.sin(sw.x) - 1.4 * sw.vx + rand(-1, 1) * 25 * sw.heat) * dt;
      sw.z += sw.vz * dt;
      sw.x += sw.vx * dt;
      piv.userData.swing(sw.x, sw.z);
    }
  };
  emitters.add(swingPhys);

  // Lanzamiento: entra girando sobre su eje, con la hoja por delante, estela y líneas de velocidad
  const throwKunai = async (k) => {
    const tgt = k.userData.target, from = tgt.clone().addScaledVector(KUNAI_DIR, -7);
    const idle = k.userData.idle;
    k.visible = true;
    const zl = zoomLines(k.userData.tipPt);
    sfx.whoosh(true);
    await tween(380, (t) => {
      const e = ease.inCubic(t);
      k.position.lerpVectors(from, tgt, e);
      k.scale.setScalar(kScale);
      idle.quaternion.setFromAxisAngle(KUNAI_DIR, (1 - e) * Math.PI * 8);
      zl.set(t);
      for (let i = 0; i < 3; i++) {
        FX.spawn({
          pos: k.position.clone().addScaledVector(KUNAI_DIR, rand(-0.8, 0.4)),
          vel: KUNAI_DIR.clone().multiplyScalar(-rand(0.5, 2)), life: rand(0.2, 0.4),
          size: rand(0.08, 0.16), size1: 0.02, colors: [C('#ffffff'), C('#bfe8ff'), C('#4a7aa8')], alpha: 0.7,
        });
      }
    });
    idle.quaternion.identity();
    // Clavado: golpe seco, polvo, temblor fuerte y las letras cercanas se sacuden
    sfx.thunk();
    shake(0.16 * kScale);
    const tp = k.userData.tipPt;
    sparkBurst(tp.clone().setZ(0.3), 24, { speed: 3.5, size: 0.07, life: 0.5 });
    for (let i = 0; i < 6; i++) {
      SMOKE.spawn({
        pos: tp.clone().setZ(0.2), vel: new THREE.Vector3(rand(-1.2, 1.2), rand(0.1, 0.8), 0), drag: 3,
        life: rand(0.5, 0.9), size: 0.2, size1: 0.6, map: TEX_SMOKE, colors: [C('#d8d0c4'), C('#6a645c')], alpha: 0.4,
      });
    }
    joltLetters(tp);
    crackAt(tp);
    // el papel sigue de largo por inercia y empieza a columpiarse
    k.userData.sw.vz += rand(-4.5, -3);
    k.userData.sw.vx += rand(2, 3.5);
    scene.remove(zl.g);
    zl.mat.dispose();
    // destello de impacto: anillo corto y rayas que salen
    shockwave(tp.clone().setZ(0.4), 2.2, 320, 0xffffff);
    tween(800, (t) => { idle.rotation.z = Math.sin(t * 42) * 0.14 * (1 - t); });
  };
  await throwKunai(main);

  // Regalos: el kunai se multiplica con clones de sombra (¡poof!)
  for (const k of ks.filter((x) => x !== main)) {
    await wait(170);
    k.visible = true;
    k.position.copy(k.userData.target);
    k.scale.setScalar(0.001);
    sfx.poof();
    for (let i = 0; i < 14; i++) {
      const d = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(0, 0.5)).normalize();
      SMOKE.spawn({
        pos: k.position.clone().setZ(0.5), vel: d.multiplyScalar(rand(0.8, 2.2)), drag: 3.5,
        life: rand(0.5, 0.9), size: rand(0.35, 0.6), size1: rand(0.9, 1.4), map: TEX_SMOKE,
        colors: [C('#ffffff'), C('#cfd4dc'), C('#8a9099')], alpha: 0.85, order: 30,
      });
    }
    tween(260, (t) => k.scale.setScalar(kScale * Math.max(0.001, ease.outBack(t))));
    joltLetters(k.userData.tipPt, 0.8);
    crackAt(k.userData.tipPt, 230);
    k.userData.sw.vz += rand(-2.5, 2.5);
  }
  await wait(250);

  // Mecha: el papel se consume desde la punta hacia el kunai, con borde incandescente, chispas, ceniza y humo
  sfx.sizzle(hold);
  const start = NOW;
  for (const kn of ks) {
    const g = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX_GLOW, color: 0xff7a20, blending: THREE.AdditiveBlending, transparent: true,
      depthWrite: false, depthTest: false, toneMapped: false, opacity: 0,
    }));
    g.renderOrder = 20;
    scene.add(g);
    kn.userData.glow = g;
  }
  const v = new THREE.Vector3();
  const fuse = (now) => {
    const k = Math.min(1, (now - start) / hold);
    const burnAt = 1.02 - 0.94 * ease.inOutSine(k);
    const flick = 0.7 + Math.random() * 0.6;
    for (const kn of ks) {
      const p = kn.userData.paper;
      kn.userData.idle.position.set(rand(-1, 1) * 0.025 * k * k, rand(-1, 1) * 0.025 * k * k, 0);
      if (!p?.userData.burn) continue;
      p.userData.burn.uBurn.value = burnAt;
      kn.userData.sw.heat = 0.2 + k * 0.8;
      kn.userData.sw.len = burnAt;
      p.material.emissiveIntensity = k * 0.5 * flick;
      // puntos del papel justo en el borde que se está quemando
      const us = p.userData.u, P = p.geometry.attributes.position;
      const edge = [];
      for (let i = 0; i < us.length; i++) if (Math.abs(us[i] - burnAt) < 0.05) edge.push(i);
      const at = () => (edge.length
        ? p.localToWorld(v.fromBufferAttribute(P, edge[(Math.random() * edge.length) | 0])).clone()
        : kn.position.clone());
      const g = kn.userData.glow;
      g.position.copy(at()).setZ(0.6);
      g.scale.setScalar((0.6 + 0.9 * k) * flick * kScale);
      g.material.opacity = 0.35 + 0.5 * k;
      for (let i = 0; i < 2 + Math.floor(k * 4); i++) {
        FX.spawn({
          pos: at(), vel: new THREE.Vector3(rand(-2, 2), rand(0.5, 3.2), rand(-0.5, 1)),
          grav: 6, drag: 0.5, life: rand(0.3, 0.65), size: rand(0.06, 0.13), size1: 0.02, colors: FIRE, order: 21,
        });
      }
      // ceniza que cae
      if (Math.random() < 0.35) {
        FX.spawn({
          pos: at(), vel: new THREE.Vector3(rand(-0.3, 0.3), rand(-0.2, 0.3), 0), grav: 0.8, life: rand(0.8, 1.4),
          size: rand(0.04, 0.07), colors: [C('#ff9a40'), C('#5a2a10'), C('#1a1a1a')], alpha: 0.9,
        });
      }
      if (Math.random() < 0.25 + k * 0.4) {
        SMOKE.spawn({
          pos: at(), vel: new THREE.Vector3(rand(-0.2, 0.2), rand(0.4, 0.9), 0), life: rand(1, 1.6),
          size: 0.25, size1: 0.9, map: TEX_SMOKE, colors: [C('#8a8a8a'), C('#3a3a3a')], alpha: 0.3,
        });
      }
    }
  };
  emitters.add(fuse);
  await wait(hold);
  emitters.delete(fuse);

  // ¡Boom! en cadena: explota lo que queda del papel, el nombre sale volando y el kunai sale disparado
  const blasts = ks.map((kn) => kn.userData.glow.position.clone().setZ(0.4));
  blowCard(blasts);
  shatterCracks();
  for (const [i, kn] of ks.entries()) {
    const g = kn.userData.glow;
    scene.remove(g);
    g.material.dispose();
    explode(blasts[i], big * (n > 1 ? 0.8 : 1));
    if (kn.userData.paper) kn.userData.paper.visible = false;
    const from = kn.position.clone(), dir = new THREE.Vector3(rand(-1, 1), rand(-1.4, -0.6), 1.5);
    tween(700, (t) => {
      kn.position.copy(from).addScaledVector(dir, ease.outCubic(t) * 3);
      kn.rotation.z -= 0.35;
      kn.scale.setScalar(kScale * (1 - t));
    }).then(() => scene.remove(kn));
    await wait(160);
  }
  await wait(1400);
  emitters.delete(swingPhys);
  card.className = '';
}

const FIREBALL = [C('#fff4c0'), C('#ffc040'), C('#ff6a10'), C('#a01c00'), C('#2a0800')];
function explode(pos, big = 1) {
  sfx.boom(big);
  shake(0.3 * big);
  flash(pos, 3.5 * big, 220, 0xffe6b0);
  shockwave(pos, 3.6 * big, 450, 0xff9a40);
  for (let i = 0; i < 16 * big; i++) {
    const dir = new THREE.Vector3(rand(-1, 1), rand(-0.5, 1), rand(-0.3, 0.5)).normalize();
    FX.spawn({
      pos: pos.clone().addScaledVector(dir, rand(0, 0.25)), vel: dir.multiplyScalar(rand(1, 3) * big),
      drag: 3, grav: -0.6, life: rand(0.45, 0.85), size: rand(0.35, 0.65) * big, size1: rand(1, 1.5) * big,
      colors: FIREBALL, alpha: 0.9, map: TEX_SMOKE, spin: rand(-2, 2), order: 12,
    });
  }
  for (let i = 0; i < 14 * big; i++) {
    const dir = new THREE.Vector3(rand(-1, 1), rand(-0.3, 1), rand(-0.2, 0.3)).normalize();
    SMOKE.spawn({
      pos: pos.clone(), vel: dir.multiplyScalar(rand(0.6, 1.6) * big), drag: 1.4, grav: -0.35,
      life: rand(1.4, 2.3), size: rand(0.4, 0.7) * big, size1: rand(1.4, 2) * big, map: TEX_SMOKE,
      colors: [C('#4a3c34'), C('#2a2522'), C('#1a1a1a')], alpha: 0.5, spin: rand(-0.6, 0.6), order: 5,
    });
  }
  sparkBurst(pos, 50 * big, { speed: 7 * big, colors: FIRE, size: 0.08, life: 1.1, grav: 5 });
}

// ============================================================
// Alerta: Monedero de Gama-chan (donaciones)
// ============================================================
const coinGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.035, 32);
const coinFace = new THREE.MeshStandardMaterial({ map: TEX_COIN, metalness: 0.85, roughness: 0.3 });
const coinSide = new THREE.MeshStandardMaterial({ color: 0xc8871f, metalness: 0.9, roughness: 0.35 });
const coinMats = [coinSide, coinFace, coinFace];

// Punto de la boca en el espacio local de la rana (sigue giro, escala y aplastado)
// (la boca del modelo mira hacia -X dentro de su grupo; FRONT la gira hacia la cámara)
const MOUTH_LOCAL = new THREE.Vector3(-0.95, 0.18, 0);
const FRONT = Math.PI / 2;

async function walletAlert({ name, amount, msg = '', hold = CFG.holdMs }) {
  const W = M.wallet, idle = W.userData.idle;
  const base = ANCHOR.clone().add(new THREE.Vector3(0, 0.15, 0));
  // pose: giro base; sway: cuánto se balancea/brinca sola (0 = quieta)
  // pitch > 0 inclina la cara hacia la cámara (se ven los ojos y la boca de frente)
  const pose = { yaw: FRONT, pitch: 0.32, roll: 0, sway: 0 };
  const spring = { v: 0, x: 0 };
  const nod = { v: 0, x: 0 }; // cabeceo de "ñam" al tragar
  const mouthRig = W.userData.rig;
  const jaw = { x: 0 }; // 0 abierta, 1 cerrada
  let rattle = 0; // temblor extra de las monedas del piso; decae solo
  mouthRig.update(0, 0, 0);
  let got = 0;
  W.visible = true;
  W.scale.setScalar(1);
  idle.position.set(0, 0, 0);
  const mouth = () => idle.localToWorld(MOUTH_LOCAL.clone());

  const coins = [];
  const g = 9;
  const phys = (now, dt) => {
    const s = now / 1000;
    spring.v += (-spring.x * 220 - spring.v * 12) * dt;
    spring.x += spring.v * dt;
    nod.v += (-nod.x * 160 - nod.v * 10) * dt;
    nod.x += nod.v * dt;
    rattle *= Math.exp(-dt * 5);
    mouthRig.update(jaw.x, 0.04 + rattle, s);
    W.scale.setScalar(1 + 0.22 * Math.min(1, got / 40));
    idle.scale.set(1 + spring.x, 1 - spring.x, 1 + spring.x);
    // bamboleo tipo pato: se ladea al ritmo de los brinquitos y gira poco para no perder el frente
    idle.rotation.set(
      pose.pitch + nod.x,
      pose.yaw + Math.sin(s * 1.6) * 0.32 * pose.sway,
      pose.roll + Math.sin(s * 4.2) * 0.16 * pose.sway,
    );
    idle.position.y = Math.abs(Math.sin(s * 4.2)) * 0.16 * pose.sway;
    for (const c of coins) {
      if (c.done) continue;
      c.t += dt;
      c.vel.y -= g * dt;
      c.mesh.position.addScaledVector(c.vel, dt);
      // tramo final: la moneda se corrige hacia la boca, que se está moviendo
      if (c.t > c.T * 0.6) c.mesh.position.lerp(mouth(), Math.min(1, dt * 14));
      c.mesh.rotation.x += c.spin.x * dt;
      c.mesh.rotation.z += c.spin.z * dt;
      if (c.t >= c.T) {
        c.done = true;
        scene.remove(c.mesh);
        got++;
        spring.v += 1.4;
        nod.v += 2.2;
        rattle = Math.min(0.35, rattle + 0.12);
        sfx.coin();
        FX.spawn({ pos: c.mesh.position.clone(), vel: new THREE.Vector3(0, 0.6, 0), life: 0.35, size: 0.35, size1: 0.6, colors: GOLD });
        bumpAmount(money(amount * got / n));
      }
    }
  };
  emitters.add(phys);

  // Entrada: cae girando y aterriza de frente
  sfx.whoosh(false);
  await tween(1000, (t) => {
    W.position.set(base.x, lerp(base.y + 4, base.y, ease.outBounce(t)), 0);
    pose.yaw = FRONT + (1 - ease.outCubic(t)) * Math.PI * 5;
  });
  sfx.land();
  shake(0.06);
  spring.v += 2;
  rattle = 0.4;

  showCard({ kicker: 'Donación', name, amount: money(0), msg, accent: '#ff8a2a', theme: 'wallet' });

  // Lluvia de monedas: la rana se balancea y brinca mientras las atrapa
  tween(400, (t) => { pose.sway = t; });
  const n = Math.min(60, 6 + Math.round(Math.sqrt(amount) * 4));
  const spawnSpan = Math.min(3000, n * 80);
  for (let i = 0; i < n; i++) {
    const mesh = new THREE.Mesh(coinGeo, coinMats);
    const p0 = new THREE.Vector3(rand(-4, 4), rand(3, 3.6), rand(-0.5, 0.5));
    const T = rand(0.7, 1.05);
    const vel = mouth().sub(p0).addScaledVector(new THREE.Vector3(0, -g, 0), -0.5 * T * T).divideScalar(T);
    mesh.position.copy(p0);
    mesh.rotation.set(rand(0, 6), 0, rand(0, 6));
    scene.add(mesh);
    coins.push({ mesh, vel, T, t: 0, spin: { x: rand(-12, 12), z: rand(-8, 8) } });
    await wait(spawnSpan / n);
  }
  while (got < n) await wait(50);
  bumpAmount(money(amount));

  // Se queda quieta de frente, cierra la boca de golpe y da un salto con vuelta completa
  const sw0 = pose.sway;
  await tween(300, (t) => { pose.sway = sw0 * (1 - t); });
  await tween(220, (t) => { jaw.x = ease.outBack(t); });
  sfx.clasp();
  spring.v += 2.5;
  rattle = 0.3;
  await wait(250);
  sfx.shimmer(2);
  sparkBurst(mouth(), 50, { speed: 3.5, colors: GOLD });
  const y0 = W.position.y;
  await tween(700, (t) => {
    W.position.y = y0 + Math.sin(t * Math.PI) * 0.9;
    pose.yaw = FRONT + ease.inOutSine(t) * Math.PI * 2;
    pose.pitch = 0.32 - Math.sin(t * Math.PI) * 0.45;
  });
  pose.yaw = FRONT;
  sfx.land();
  spring.v += 3;
  rattle = 0.45;

  // Espera contenta, con un balanceo suave
  tween(500, (t) => { pose.sway = 0.3 * t; });
  await wait(Math.max(1500, hold - 2700));

  // Salida: brinca hacia arriba girando y se encoge
  emitters.delete(phys);
  hideCard();
  sfx.whoosh(true);
  spring.v += 2;
  const yaw0 = idle.rotation.y;
  await tween(650, (t) => {
    const e = ease.inCubic(t);
    W.position.y = y0 + Math.sin(t * Math.PI * 0.5) * 3.2;
    idle.rotation.y = yaw0 + e * Math.PI * 3;
    W.scale.multiplyScalar(0.985);
  });
  sparkBurst(W.position.clone(), 30, { speed: 2.5, colors: GOLD, size: 0.08 });
  W.visible = false;
}

// ============================================================
// Alerta: Cinnamoroll volando
// ============================================================
const SKY = [C('#ffffff'), C('#d8f0ff'), C('#8fd0ff'), C('#4f9fd8')];
const PINK = [C('#ffffff'), C('#ffd6ea'), C('#ff9cc8'), C('#e0609a')];
async function cinnaAlert({ kicker, name, amount = '', msg = '', hold = CFG.holdMs }) {
  const R = M.cinna, c = R.userData.cinna, idle = R.userData.idle;
  const home = ANCHOR.clone().add(new THREE.Vector3(0, 0.05, 0));
  // flap: rapidez del aleteo; wave: saludo del brazo; kick: pataleo; tilt: inclinación de vuelo
  const st = { flap: 14, lift: 1, wave: 0, kick: 1, tilt: 0.35, roll: 0, hop: 0 };
  let phase = 0;
  R.visible = true;
  R.scale.setScalar(1);
  R.rotation.set(0, 0, 0);
  idle.position.set(0, 0, 0);

  const anim = (now, dt) => {
    const s = now / 1000;
    phase += dt * st.flap;
    // orejas como alas: suben y bajan desde la raíz
    const f = 0.35 + st.lift * (0.5 + 0.5 * Math.sin(phase));
    c.earR.rotation.set(0, 0, f);
    c.earL.rotation.set(0, 0, -f);
    // cuerpo flotando y cabeza ladeada
    idle.position.y = Math.sin(s * 2.4) * 0.12 + Math.sin(phase) * 0.02;
    idle.rotation.set(st.tilt + Math.sin(s * 1.7) * 0.05, Math.sin(s * 0.9) * 0.25, st.roll + Math.sin(s * 1.3) * 0.06);
    c.neck.rotation.set(Math.sin(s * 2.1) * 0.06, 0, Math.sin(s * 1.6) * 0.14);
    // saludo con el brazo derecho; el izquierdo acompaña
    c.armR.rotation.set(0, 0, st.wave * (1.7 + Math.sin(s * 11) * 0.45) + (1 - st.wave) * Math.sin(s * 3) * 0.2);
    c.armL.rotation.set(0, 0, -Math.sin(s * 3 + 1) * 0.2 - st.wave * 0.3);
    // pataleo alternado y colita inquieta
    c.feet.forEach((ft, i) => ft.rotation.set(Math.sin(s * 9 + i * Math.PI) * 0.35 * st.kick, 0, 0));
    c.tail.rotation.set(0, Math.sin(s * 6) * 0.35, Math.sin(s * 4) * 0.1);
    // el ositito rebota sobre la cabeza
    const b = Math.abs(Math.sin(s * 5.5));
    c.bear.position.y = c.bearY + b * 0.05 + st.hop;
    c.bear.scale.set(1 + (1 - b) * 0.08, 1 - (1 - b) * 0.08, 1 + (1 - b) * 0.08);
    // nubecitas que suelta al volar
    if (Math.random() < dt * (st.flap > 10 ? 18 : 5)) {
      SMOKE.spawn({
        pos: R.position.clone().add(new THREE.Vector3(rand(-0.6, 0.6), rand(-0.9, -0.4), -0.3)),
        vel: new THREE.Vector3(rand(-0.3, 0.3), rand(-0.4, -0.1), 0), drag: 1.5, life: rand(0.8, 1.3),
        size: rand(0.2, 0.35), size1: rand(0.5, 0.8), map: TEX_SMOKE, colors: [C('#ffffff'), C('#e4f4ff')], alpha: 0.7,
      });
    }
  };
  emitters.add(anim);

  // Entrada: llega volando desde la derecha, aleteando rápido e inclinado
  const from = home.clone().add(new THREE.Vector3(7, 0.6, 0));
  sfx.flap(1100, 12);
  await tween(1100, (t) => {
    const e = ease.outCubic(t);
    R.position.lerpVectors(from, home, e);
    R.position.y += Math.sin(t * Math.PI) * 0.3;
    st.roll = 0.35 * (1 - e);
    st.tilt = 0.35 * (1 - e) + 0.08;
  });
  // se frena, aletea normal y saluda
  tween(500, (t) => { st.flap = lerp(14, 6, t); st.lift = lerp(1, 0.7, t); st.wave = t; });
  sfx.twinkle();
  sparkBurst(home.clone().setZ(0.5), 40, { speed: 2.5, colors: SKY, size: 0.09 });
  showCard({ kicker, name, amount, msg, accent: '#8fd0ff', theme: 'cinna' });

  // corazones y brillitos mientras flota
  const hearts = (now, dt) => {
    if (Math.random() < dt * 5) {
      const side = Math.random() < 0.5 ? -1 : 1;
      FX.spawn({
        pos: R.position.clone().add(new THREE.Vector3(side * rand(0.9, 1.6), rand(0, 1), 0.6)),
        vel: new THREE.Vector3(side * rand(0.1, 0.4), rand(0.6, 1.1), 0), life: rand(1.4, 2),
        size: rand(0.28, 0.42), size1: 0.18, map: TEX_HEART, colors: PINK, spin: rand(-0.5, 0.5),
      });
    }
    if (Math.random() < dt * 10) {
      FX.spawn({
        pos: R.position.clone().add(new THREE.Vector3(rand(-1.5, 1.5), rand(-1, 1.5), 0.3)),
        vel: new THREE.Vector3(0, rand(0.1, 0.4), 0), life: rand(0.6, 1.1), size: rand(0.05, 0.1), colors: SKY,
      });
    }
  };
  emitters.add(hearts);
  sfx.flap(hold, 6);
  await wait(Math.max(900, hold * 0.35));
  tween(300, (t) => { st.wave = 1 - t; });

  // Voltereta en el aire: gira completo, el ositito brinca y cae
  sfx.whee();
  const y0 = R.position.y;
  await tween(900, (t) => {
    R.rotation.x = -ease.inOutSine(t) * Math.PI * 2;
    R.position.y = y0 + Math.sin(t * Math.PI) * 0.5;
    st.hop = Math.sin(t * Math.PI) * 0.12;
    st.flap = 6 + Math.sin(t * Math.PI) * 8;
  });
  R.rotation.x = 0;
  st.hop = 0;
  sparkBurst(R.position.clone().setZ(0.5), 30, { speed: 2, colors: PINK, size: 0.08 });
  sfx.twinkle();
  await wait(Math.max(700, hold * 0.65 - 900));

  // Salida: se despide y sale volando hacia arriba a la izquierda
  tween(300, (t) => { st.wave = t; });
  await wait(450);
  emitters.delete(hearts);
  hideCard();
  sfx.flap(900, 12);
  const p0 = R.position.clone(), to = p0.clone().add(new THREE.Vector3(-6, 4, 0));
  await tween(900, (t) => {
    const e = ease.inCubic(t);
    st.flap = 14;
    st.lift = 1;
    st.roll = -0.35 * e;
    st.tilt = 0.08 + 0.3 * e;
    R.position.lerpVectors(p0, to, e);
  });
  emitters.delete(anim);
  R.visible = false;
}

// Cola de alertas
// ============================================================
const queue = [];
let busy = false;
function enqueue(fn) {
  queue.push(fn);
  if (!busy) run();
}
async function run() {
  busy = true;
  while (queue.length) {
    try { await queue.shift()(); } catch (e) { console.error(e); }
    await wait(500);
  }
  busy = false;
}

const TIERS = { 1000: 'Tier 1', 2000: 'Tier 2', 3000: 'Tier 3', prime: 'Prime' };
function bitsColor(b) {
  if (b >= 10000) return '#ff3d4a';
  if (b >= 5000) return '#3d8bff';
  if (b >= 1000) return '#1fd6c1';
  if (b >= 100) return '#a970ff';
  return '#c9c9d6';
}

const api = {
  follow: (name) => enqueue(() => puzzleAlert({ level: 1, kicker: 'Nuevo seguidor', name, hold: 4000 })),
  sub: ({ name, months = 1, tier = '1000', msg = '' }) => enqueue(() => kunaiAlert({
    name, msg, big: tier === '3000' ? 1.4 : 1,
    kicker: months > 1 ? `${months} meses · ${TIERS[tier] || 'Sub'}` : `Nueva sub · ${TIERS[tier] || 'Tier 1'}`,
  })),
  gift: ({ sender, count = 1, recipient = '' }) => enqueue(() => kunaiAlert({
    name: sender, count, big: count >= 10 ? 1.3 : 1,
    kicker: count > 1 ? `Regaló ${count} subs` : `Regaló una sub a ${recipient}`,
  })),
  cheer: ({ name, amount, msg = '' }) => enqueue(() => puzzleAlert({
    level: amount >= 5000 ? 4 : amount >= 1000 ? 3 : amount >= 100 ? 2 : 1,
    color: bitsColor(amount), kicker: `${amount.toLocaleString('es-MX')} bits`, name, msg,
  })),
  raid: ({ name, viewers }) => enqueue(() => puzzleAlert({
    level: 4, raid: true, color: '#b36bff', kicker: `¡Raid de ${viewers} espectadores!`, name, hold: 7000,
  })),
  tip: ({ name, amount, msg = '' }) => enqueue(() => walletAlert({ name, amount, msg })),
  cinna: (name) => enqueue(() => cinnaAlert({ kicker: 'Nuevo seguidor', name })),
};
window.alerts3d = api;

// ============================================================
// StreamElements
// ============================================================
// Un script clásico en el HTML guarda en window.__se lo que llegue antes de que este módulo cargue
function seLoad(detail) {
  const f = detail?.fieldData || {};
  if (f.modelsUrl) CFG.models = f.modelsUrl.replace(/\/?$/, '/');
  if (f.volume != null) CFG.volume = f.volume / 100;
  if (f.holdSeconds) CFG.holdMs = f.holdSeconds * 1000;
  if (f.look) CFG.look = f.look;
  CFG.currency = f.currency || detail?.currency?.symbol || CFG.currency;
}
function seEvent(detail) {
  const l = detail?.listener, e = detail?.event;
  if (!e) return;
  const name = e.name || 'Anónimo';
  switch (l) {
    case 'follower-latest': api.follow(name); break;
    case 'subscriber-latest':
      if (e.isCommunityGift) break; // los individuales de un regalo masivo
      if (e.bulkGifted) api.gift({ sender: e.sender || name, count: e.amount });
      else if (e.gifted) api.gift({ sender: e.sender || 'Anónimo', recipient: name });
      else api.sub({ name, months: e.amount || 1, tier: String(e.tier || '1000'), msg: e.message || '' });
      break;
    case 'cheer-latest': api.cheer({ name, amount: e.amount, msg: e.message || '' }); break;
    case 'raid-latest': api.raid({ name, viewers: e.amount }); break;
    case 'tip-latest': api.tip({ name, amount: e.amount, msg: e.message || '' }); break;
  }
}
const SE = window.__se || { load: null, queue: [] };
if (SE.load) seLoad(SE.load);
window.addEventListener('onWidgetLoad', (obj) => seLoad(obj.detail));

// ============================================================
// Bucle principal
// ============================================================
function frame(dt) {
  NOW += dt * 1000;
  for (let i = timers.length - 1; i >= 0; i--) {
    if (timers[i].at <= NOW) { timers[i].r(); timers.splice(i, 1); }
  }
  for (const tk of [...tickers]) tk(NOW);
  for (const em of emitters) em(NOW, dt);
  FX.update(dt);
  SMOKE.update(dt);
  shakeAmp *= Math.exp(-dt * 6);
  camera.position.set(CAM_BASE.x + rand(-1, 1) * shakeAmp, CAM_BASE.y + rand(-1, 1) * shakeAmp, CAM_BASE.z);
  renderer.render(scene, camera);
}

const STEP = new URLSearchParams(location.search).has('step');
let last = performance.now();
function loop(now) {
  frame(Math.min(0.05, (now - last) / 1000));
  last = now;
  requestAnimationFrame(loop);
}

await loadModels();
// Eventos que llegaron mientras cargaban los modelos
window.addEventListener('onEventReceived', (obj) => seEvent(obj.detail));
SE.ready = true;
SE.queue.splice(0).forEach(seEvent);
if (STEP) {
  // Avanza la escena y las animaciones CSS del texto de forma determinista
  window.__advance = async (ms) => {
    const dt = 1 / 60;
    for (let t = 0; t < ms; t += dt * 1000) {
      frame(dt);
      await new Promise((r) => setTimeout(r, 0));
      for (const a of document.getAnimations()) {
        a.pause();
        a.currentTime = (a.currentTime || 0) + dt * 1000;
      }
    }
    return NOW;
  };
} else {
  requestAnimationFrame(loop);
}
window.__ready = true;
